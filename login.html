<!doctype html>
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | Pata &amp; Afeto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/preferencias.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
  <script defer src="js/script.js"></script>
</head>
<body>
<a class="pular" href="#conteudo">Pular para o conteúdo</a>
<header class="barra">
  <div class="container barra-interna">
    <a class="marca" href="index.html"><span aria-hidden="true">🐾</span> Pata &amp; Afeto</a>
    <nav aria-label="Navegação principal">
      <a href="index.html#servicos">Serviços</a>
      <a href="index.html#adocao">Adoção</a>
      <a href="index.html#contato">Contato</a>
      <a href="login.html">Entrar</a>
    </nav>
    <details class="preferencias">
      <summary>Acessibilidade</summary>
      <div class="painel">
        <button type="button" class="botao secundario" id="tema" aria-pressed="false">Modo escuro</button>
        <fieldset>
          <legend>Tamanho da fonte</legend>
          <button type="button" class="botao secundario" data-fonte="normal" aria-pressed="true">Padrão</button>
          <button type="button" class="botao secundario" data-fonte="grande" aria-pressed="false">Maior</button>
          <button type="button" class="botao secundario" data-fonte="extra" aria-pressed="false">Extra</button>
        </fieldset>
      </div>
    </details>
  </div>
</header>
<main id="conteudo" class="secao container login" tabindex="-1">
  <a href="index.html">← Voltar ao início</a>
  <h1>Entrar</h1>
  <p id="ajuda-login">Área demonstrativa. Use um e-mail fictício e o código <strong>pata123</strong>.</p>
  <form class="cartao formulario" id="form-login" aria-describedby="ajuda-login">
    <label for="email-login">E-mail</label><input id="email-login" type="email" autocomplete="off" maxlength="150" required>
    <label for="codigo">Código de demonstração</label><input id="codigo" type="password" autocomplete="off" maxlength="50" required>
    <button class="botao" type="submit">Entrar na demonstração</button>
    <p class="retorno" role="status"></p>
  </form>
</main>
<footer class="rodape">
  <div class="container">
    <a class="marca" href="index.html">Pata &amp; Afeto</a>
    <p>Projeto acadêmico de Desenvolvimento de Interfaces · CEUB</p>
    <a href="index.html#contato">Contato</a> · <a href="https://github.com/luisa99-web/PROJ_PETSHOP">Código no GitHub</a>
  </div>
</footer>
</body>
</html>
